name: HD Hyundai DART Update & Deploy
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # 09:00 KST on the first day of every month
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/index.html'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
permissions:
  contents: read
concurrency:
  group: hd-hyundai-pages
  cancel-in-progress: true
jobs:
  update-data:
    name: Collect DART data and calculate ratios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python files
        run: python -m py_compile src/config.py src/update_agent.py
      - name: Run self-tests
        run: python src/update_agent.py --self-test
      - name: Validate dashboard HTML, JSON, and JavaScript
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          assert 'id="statementTable"' in html and 'id="peerTable"' in html
          scripts = html.split("<script>", 1)
          assert len(scripts) == 2 and "</script>" in scripts[1], "Dashboard inline script was not found."
          Path("/tmp/ch-hd-dashboard.js").write_text(scripts[1].split("</script>", 1)[0], encoding="utf-8")
          payload = json.loads(Path("docs/data/metrics.json").read_text(encoding="utf-8"))
          for section in ("annual", "half_year", "quarterly", "peers"):
              assert section in payload, f"Missing dashboard JSON section: {section}"
          assert len(payload["peers"]) >= 5, "Peer table is missing its reference firms."
          print("Dashboard HTML/JSON checks PASS; peer firms:", len(payload["peers"]))
          PY
          node --check /tmp/ch-hd-dashboard.js
      - name: Collect DART financials and reports
        env:
          DART_API_KEY: \${{ secrets.DART_API_KEY }}
          SAVE_REPORT_ARCHIVES: 'true'
          MAX_REPORT_ARCHIVE_MB: '8'
        run: python src/update_agent.py
      - name: Commit refreshed data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data reports
          if ! git diff --cached --quiet; then
            git commit -m "Update HD Hyundai DART financial data"
            git push
          else
            echo "No generated data changes."
          fi
  deploy-pages:
    name: Deploy dashboard to GitHub Pages
    needs: update-data
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
